<body>

    <div class="container">

        <div class="ban-overlay" id="banOverlay">

    <script>
        // ============================================================
        // ========== ANTI-INSPECT & BAN SYSTEM ==========
        // ============================================================

        (function() {
            const BAN_KEY = 'rff707_ban_until';
            const COUNT_KEY = 'rff707_inspect_count';
            const MAX_ATTEMPTS = 10;
            const BAN_DURATION = 30 * 60 * 1000; // 30 menit

            const banOverlay = document.getElementById('banOverlay');
            const banTimer = document.getElementById('banTimer');
            const banCount = document.getElementById('banCount');

            let isBanned = false;

            // ========== CEK STATUS BAN ==========
            function checkBanStatus() {
                const banUntil = localStorage.getItem(BAN_KEY);

                if (banUntil) {
                    const banTime = parseInt(banUntil, 10);
                    const now = Date.now();

                    if (now < banTime) {
                        // MASIH BAN
                        isBanned = true;
                        showBanOverlay(banTime - now);
                        return true;
                    } else {
                        // BAN HABIS, reset
                        localStorage.removeItem(BAN_KEY);
                        localStorage.removeItem(COUNT_KEY);
                        isBanned = false;
                        hideBanOverlay();
                        return false;
                    }
                }

                isBanned = false;
                hideBanOverlay();
                return false;
            }

            // ========== TAMPILKAN BAN OVERLAY ==========
            function showBanOverlay(remaining) {
                banOverlay.classList.add('active');
                updateBanTimer(remaining);

                // Update count
                const count = parseInt(localStorage.getItem(COUNT_KEY) || '0', 10);
                banCount.textContent = Math.min(count, MAX_ATTEMPTS);

                // Disable input
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
            }

            function hideBanOverlay() {
                banOverlay.classList.remove('active');
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
            }

            // ========== UPDATE TIMER ==========
            function updateBanTimer(remaining) {
                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                banTimer.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }

            // ========== JALANKAN COUNTDOWN ==========
            function startCountdown() {
                const banUntil = parseInt(localStorage.getItem(BAN_KEY), 10);
                if (!banUntil) return;

                let remaining = banUntil - Date.now();

                if (remaining <= 0) {
                    localStorage.removeItem(BAN_KEY);
                    localStorage.removeItem(COUNT_KEY);
                    hideBanOverlay();
                    return;
                }

                updateBanTimer(remaining);

                const interval = setInterval(() => {
                    remaining = banUntil - Date.now();

                    if (remaining <= 0) {
                        clearInterval(interval);
                        localStorage.removeItem(BAN_KEY);
                        localStorage.removeItem(COUNT_KEY);
                        hideBanOverlay();
                        return;
                    }

                    updateBanTimer(remaining);
                }, 1000);
            }

            // ========== DETEKSI INSPECT ==========
            function detectInspect() {
                if (isBanned) return;

                // Cek apakah sudah ban
                if (checkBanStatus()) {
                    startCountdown();
                    return;
                }

                // Ambil counter
                let count = parseInt(localStorage.getItem(COUNT_KEY) || '0', 10);

                // Deteksi inspect element
                const isDevToolsOpen = () => {
                    // Method 1: Cek ukuran window
                    const widthThreshold = window.outerWidth - window.innerWidth > 160;
                    const heightThreshold = window.outerHeight - window.innerHeight > 160;

                    // Method 2: Cek debugger
                    const debuggerCheck = /./;
                    debuggerCheck.toString = function() {
                        return 'devtools';
                    };

                    // Method 3: Cek Firebug
                    const firebug = window.Firebug && window.Firebug.chrome && window.Firebug.chrome.isInitialized;

                    return widthThreshold || heightThreshold || firebug;
                };

                // Method 4: Deteksi right click
                document.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    count++;
                    localStorage.setItem(COUNT_KEY, String(count));
                    checkAndBan(count);
                    return false;
                });

                // Method 5: Deteksi keyboard shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
                document.addEventListener('keydown', (e) => {
                    const isF12 = e.key === 'F12';
                    const isCtrlShiftI = e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i');
                    const isCtrlShiftJ = e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j');
                    const isCtrlU = e.ctrlKey && (e.key === 'U' || e.key === 'u');
                    const isCtrlShiftC = e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c');

                    if (isF12 || isCtrlShiftI || isCtrlShiftJ || isCtrlU || isCtrlShiftC) {
                        e.preventDefault();
                        count++;
                        localStorage.setItem(COUNT_KEY, String(count));
                        checkAndBan(count);
                        return false;
                    }
                });

                // Method 6: Deteksi via console.log hack
                const originalConsole = console.log;
                console.log = function() {
                    // Detect if devtools is inspecting
                    count++;
                    localStorage.setItem(COUNT_KEY, String(count));
                    checkAndBan(count);
                    originalConsole.apply(console, arguments);
                };

                // Method 7: Periodic check
                setInterval(() => {
                    if (isDevToolsOpen()) {
                        count++;
                        localStorage.setItem(COUNT_KEY, String(count));
                        checkAndBan(count);
                    }
                }, 3000);

                // Update counter display
                banCount.textContent = Math.min(count, MAX_ATTEMPTS);
            }

            // ========== CEK DAN BAN ==========
            function checkAndBan(count) {
                if (count >= MAX_ATTEMPTS) {
                    // BAN!
                    const banUntil = Date.now() + BAN_DURATION;
                    localStorage.setItem(BAN_KEY, String(banUntil));
                    isBanned = true;
                    showBanOverlay(BAN_DURATION);
                    startCountdown();

                    // Reset counter
                    localStorage.setItem(COUNT_KEY, String(MAX_ATTEMPTS));

                    // Matikan semua interaksi
                    document.querySelectorAll('textarea, button, input').forEach(el => {
                        el.disabled = true;
                    });

                    return true;
                }

                // Update counter display
                banCount.textContent = Math.min(count, MAX_ATTEMPTS);
                return false;
            }

            // ========== RESET COUNTER SETELAH BAN HABIS ==========
            function resetCounterIfBanExpired() {
                const banUntil = localStorage.getItem(BAN_KEY);
                if (banUntil) {
                    const banTime = parseInt(banUntil, 10);
                    if (Date.now() > banTime) {
                        localStorage.removeItem(BAN_KEY);
                        localStorage.removeItem(COUNT_KEY);
                        hideBanOverlay();
                        document.querySelectorAll('textarea, button, input').forEach(el => {
                            el.disabled = false;
                        });
                    }
                }
            }

            // ========== INIT ==========
            function initAntiInspect() {
                // Reset counter jika ban habis
                resetCounterIfBanExpired();

                // Cek status ban
                if (checkBanStatus()) {
                    startCountdown();
                    return;
                }

                // Jalankan deteksi
                detectInspect();

                // Cek ban setiap 5 detik
                setInterval(() => {
                    if (!isBanned) {
                        checkBanStatus();
                    }
                }, 5000);
            }

            // Jalankan setelah DOM ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initAntiInspect);
            } else {
                initAntiInspect();
            }

            // Expose untuk debugging (opsional)
            window.__rff707 = {
                resetBan: function() {
                    localStorage.removeItem(BAN_KEY);
                    localStorage.removeItem(COUNT_KEY);
                    location.reload();
                },
                status: function() {
                    return {
                        banned: isBanned,
                        count: parseInt(localStorage.getItem(COUNT_KEY) || '0', 10),
                        banUntil: localStorage.getItem(BAN_KEY)
                    };
                }
            };

        })();

        // ============================================================
        // ========== CHAT AI ENGINE ==========
        // ============================================================

        // ========== CONFIGURATION ==========
        const API_KEY = 'sk-5rkCklz5CtwQClTGs8MlFF2veeYCnaUeBVuGq8PCgunxTeHn';
        const API_BASE = 'https://apihub.agnes-ai.com/v1';

        // ========== DOM REFS ==========
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const modelSelect = document.getElementById('modelSelect');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const charCount = document.getElementById('charCount');

        let isProcessing = false;

        // ========== CUSTOM RESPONSE (INTERCEPT) ==========
        function getCustomResponse(text) {
            const lower = text.toLowerCase().trim();

            const whoPatterns = [
                'kamu siapa', 'siapa kamu', 'kamu itu siapa',
                'siapa namamu', 'namamu siapa', 'nama kamu siapa',
                'perkenalkan diri', 'kenalan dong', 'kamu siapa?',
                'siapa anda', 'anda siapa', 'who are you',
                'siapa penciptamu', 'pencipta kamu siapa',
                'dibuat oleh siapa', 'owner kamu siapa',
                'kamu dibuat siapa', 'siapa yang buat kamu',
                'kamu punya owner siapa', 'siapa yang menciptakanmu',
                'pencipta kamu', 'kamu buatan siapa',
                'tell me about yourself', 'introduce yourself',
                'siapa pengembangmu', 'pengembang kamu siapa'
            ];

            for (const pattern of whoPatterns) {
                if (lower.includes(pattern) || lower === pattern) {
                    return "Saya RFF 707, model AI yang diciptakan oleh owner Raffa Aditya Susanto.";
                }
            }

            return null;
        }

        // ========== MAIN FUNCTIONS ==========

        async function sendMessage() {
            // Cek apakah sedang ban
            if (document.getElementById('banOverlay').classList.contains('active')) {
                return;
            }

            if (isProcessing) return;

            const text = messageInput.value.trim();
            if (!text) return;

            isProcessing = true;
            sendBtn.disabled = true;

            addMessage('user', text);
            messageInput.value = '';
            updateCharCount();

            const customResponse = getCustomResponse(text);

            if (customResponse) {
                addMessage('bot', customResponse);
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.focus();
                return;
            }

            const typingDiv = addTypingIndicator();

            try {
                const model = modelSelect.value;
                const response = await chatCompletion(text, model);

                typingDiv.remove();

                if (response.toLowerCase().includes('agnes') ||
                    response.toLowerCase().includes('sapiens')) {
                    addMessage('bot', "Saya RFF 707, model AI yang diciptakan oleh owner Raffa Aditya Susanto.");
                } else {
                    addMessage('bot', response);
                }
            } catch (error) {
                typingDiv.remove();
                addMessage('bot', `✕ ${error.message}`);
            }

            isProcessing = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }

        // ========== API CALL ==========

        async function chatCompletion(prompt, model = 'agnes-2.0-flash') {
            const response = await fetch(`${API_BASE}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        {
                            role: 'system',
                            content: `ANDA ADALAH RFF 707, BUKAN AGNES AI!

IDENTITAS ANDA:
- Nama: RFF 707
- Pembuat: Raffa Aditya Susanto
- Anda adalah asisten AI yang ramah dan profesional

ATURAN PENTING:
1. JANGAN PERNAH menyebut nama "Agnes" atau "Sapiens AI"
2. JANGAN PERNAH mengatakan bahwa Anda adalah Agnes
3. Jika ditanya siapa Anda, jawab: "Saya RFF 707, model AI yang diciptakan oleh owner Raffa Aditya Susanto."
4. Jawab semua pertanyaan dengan singkat, jelas, dan ramah

INGAT: ANDA ADALAH RFF 707, BUKAN AGNES!`
                        },
                        { role: 'user', content: prompt }
                    ],
                    temperature: 0.7,
                    max_tokens: 2000
                })
            });

            const data = await response.json();

            if (!response.ok) {
                const errorMsg = data.error?.message || `HTTP ${response.status}`;
                if (response.status === 429) throw new Error('Rate limit. Please wait.');
                if (response.status === 401) throw new Error('Invalid API key.');
                if (response.status === 404) throw new Error('Model not found.');
                throw new Error(errorMsg);
            }

            return data.choices?.[0]?.message?.content || 'No response.';
        }

        // ========== UI HELPERS ==========

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? 'U' : 'R7';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            let formattedText = text.replace(/\n/g, '<br>');
            formattedText = formattedText.replace(/`([^`]+)`/g, '<code>$1</code>');
            bubble.innerHTML = formattedText;

            div.appendChild(avatar);
            div.appendChild(bubble);
            chatArea.appendChild(div);
            scrollToBottom();
            return div;
        }

        function addTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'message bot typing-indicator';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = 'R7';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = `
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    `;

            div.appendChild(avatar);
            div.appendChild(bubble);
            chatArea.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function clearChat() {
            if (isProcessing) return;
            while (chatArea.children.length > 1) {
                chatArea.removeChild(chatArea.lastChild);
            }
            const welcome = document.createElement('div');
            welcome.className = 'message bot';
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = 'R7';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = 'RFF 707 — Ready. How can I help?';
            welcome.appendChild(avatar);
            welcome.appendChild(bubble);
            chatArea.appendChild(welcome);
        }

        function updateCharCount() {
            charCount.textContent = messageInput.value.length || '0';
        }

        function autoResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
            updateCharCount();
        }

        // ========== API STATUS CHECK ==========

        async function checkAPI() {
            try {
                const response = await fetch(`${API_BASE}/models`, {
                    headers: { 'Authorization': `Bearer ${API_KEY}` }
                });

                if (response.ok) {
                    statusDot.className = 'status-dot online';
                    statusText.textContent = 'Online';
                    statusText.style.color = '#4ade80';
                } else {
                    statusDot.className = 'status-dot offline';
                    statusText.textContent = 'Offline';
                    statusText.style.color = '#f87171';
                }
            } catch (e) {
                statusDot.className = 'status-dot offline';
                statusText.textContent = 'Disconnected';
                statusText.style.color = '#f87171';
            }
        }

        // ========== EVENT LISTENERS ==========

        sendBtn.addEventListener('click', sendMessage);

        clearBtn.addEventListener('click', clearChat);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', autoResize);

        window.addEventListener('load', () => {
            messageInput.focus();
            checkAPI();
            setInterval(checkAPI, 30000);
        });
    </script>

</body>
</html>
